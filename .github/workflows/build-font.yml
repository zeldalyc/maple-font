name: Maple Mono Custom Build

on:
  workflow_dispatch: 
  push:
    paths:
      - 'config.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip ttfautohint
          # 安装 Maple Mono 编译核心工具 otfcc
          wget https://github.com/nowar-fonts/otfcc-build/releases/download/v0.10.4/otfcc-64-linux-0.10.4.zip
          unzip otfcc-64-linux-0.10.4.zip
          sudo mv otfccbuild otfccdump /usr/local/bin/
          sudo chmod +x /usr/local/bin/otfcc*

      - name: Install Python Dependencies
        run: |
          # 升级 pip 并安装核心工具
          python -m pip install --upgrade pip
          pip install fonttools font-v brotli zopfli cu2qu ufo2ft ufoprocessor
          # 尝试安装项目中列出的所有特定版本依赖
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi


      - name: Build Font
        run: |
          # 确保脚本有执行权限
          chmod +x build.py || true
          python build.py

      - name: Package and Hash
        id: package
        run: |
          mkdir -p release_dist
          # 自动识别输出目录
          if [ -d "out" ]; then 
            EXPORT_DIR="out"
          elif [ -d "dist" ]; then 
            EXPORT_DIR="dist"
          else 
            echo "Error: Build output directory not found." && exit 1
          fi
          
          # 压缩并计算哈希
          cd $EXPORT_DIR
          zip -r ../release_dist/MapleMono-Custom.zip ./*.ttf ./*.otf || echo "No files found to zip"
          cd ..
          
          if [ -f "release_dist/MapleMono-Custom.zip" ]; then
            HASH_VAL=$(sha256sum release_dist/MapleMono-Custom.zip | awk '{print $1}')
            echo "sha256=$HASH_VAL" >> $GITHUB_OUTPUT
            echo "Calculated SHA256: $HASH_VAL"
          else
            echo "Error: Zip file creation failed." && exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Maple Mono Custom v1.0.${{ github.run_number }}
          body: |
            ### 编译元数据
            - **SHA256:** `${{ steps.package.outputs.sha256 }}`
            - **构建时间:** ${{ github.event.head_commit.timestamp }}
            - **说明:** 已固化 config.json 中的特性（如 cv01, zero 等）。
          files: release_dist/MapleMono-Custom.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
