name: Custom Build with SHA256

on:
  workflow_dispatch:
    inputs:
      cn:
        description: 'Include Chinese version'
        required: false
        default: false
        type: boolean
      normal:
        description: 'Remove opinionated features'
        required: false
        default: false
        type: boolean
      no_liga:
        description: 'Remove ligatures'
        required: false
        default: false
        type: boolean
      no_hinted:
        description: 'Build unhinted font'
        required: false
        default: false
        type: boolean
      width:
        description: 'Glyph width mode'
        required: false
        default: default
        type: choice
        options: [default, narrow, slim]
      nerd_font:
        description: 'Nerd Font icon mode'
        required: false
        default: default
        type: choice
        options: [default, mono, proportional]
      feat:
        description: 'Enable features (e.g. cv01,zero)'
        required: false
        default: 'cv01,zero'
        type: string
      build_args:
        description: 'Other args'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'config.json'

permissions:
  contents: write

jobs:
  custom-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 检查是否需要 fontforge 环境
          if [[ "${{ github.event.inputs.build_args }}" == *"--font-patcher"* ]] || python build.py --dry | jq -e '.nerd_font.use_font_patcher == true' >/dev/null; then
            sudo apt update -y -q
            sudo apt install software-properties-common python3-fontforge fuse -y -q
            curl -L "https://github.com/fontforge/fontforge/releases/download/20230101/FontForge-2023-01-01-a1dad3e-x86_64.AppImage" --output fontforge
            chmod u+x fontforge
            export PATH=`pwd`:$PATH
            echo "PATH=$PATH" >> $GITHUB_ENV
          fi

      - name: Run build script
        run: |
          # 使用环境变量处理默认值，防止 push 触发时 inputs 为空
          IN_CN="${{ github.event.inputs.cn || 'false' }}"
          IN_NORMAL="${{ github.event.inputs.normal || 'false' }}"
          IN_NO_LIGA="${{ github.event.inputs.no_liga || 'false' }}"
          IN_NO_HINTED="${{ github.event.inputs.no_hinted || 'false' }}"
          IN_WIDTH="${{ github.event.inputs.width || 'default' }}"
          IN_NF_MODE="${{ github.event.inputs.nerd_font || 'default' }}"
          IN_FEAT="${{ github.event.inputs.feat || 'cv01,zero' }}"
          IN_EXTRA_ARGS="${{ github.event.inputs.build_args || '' }}"

          build_args="--archive"
          
          [ "$IN_CN" == "true" ] && build_args="$build_args --cn"
          [ "$IN_NORMAL" == "true" ] && build_args="$build_args --normal"
          [ "$IN_NO_LIGA" == "true" ] && build_args="$build_args --no-liga"
          [ "$IN_NO_HINTED" == "true" ] && build_args="$build_args --no-hinted"
          
          # 只有当 width 既不为空也不是 default 时才添加参数
          if [ "$IN_WIDTH" != "default" ] && [ -n "$IN_WIDTH" ]; then
            build_args="$build_args --width $IN_WIDTH"
          fi
          
          case "$IN_NF_MODE" in
            default)      build_args="$build_args --nf" ;;
            mono)         build_args="$build_args --nf-mono" ;;
            proportional) build_args="$build_args --nf-propo" ;;
          esac
          
          if [ -n "$IN_FEAT" ]; then
            build_args="$build_args --feat $IN_FEAT"
          fi
          
          if [ -n "$IN_EXTRA_ARGS" ]; then
            build_args="$build_args $IN_EXTRA_ARGS"
          fi

          echo "BUILD_ARGS=$build_args" >> $GITHUB_ENV
          python build.py $build_args

      - name: Generate SHA256 Checksums
        run: |
          echo "### SHA256 Checksums" >> NOTES
          echo "\`\`\`" >> NOTES
          if [ -d "fonts/archive" ]; then
            cd fonts/archive
            for f in *.*; do
              sha256sum "$f" >> ../../NOTES
            done
            cd ../..
          else
            echo "No archive directory found." >> NOTES
          fi
          echo "\`\`\`" >> NOTES

      - name: Create release
        run: |
          if [ ! -d "fonts/archive" ]; then
            echo "Error: Build output directory not found."
            exit 1
          fi
          echo "### Build details" >> NOTES
          echo "- Command: \`python build.py $BUILD_ARGS\`" >> NOTES
          gh release create "v$(date +%Y%m%d-%H%M%S)" fonts/archive/*.* --notes-file NOTES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}