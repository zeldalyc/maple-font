name: Custom Build with SHA256

on:
  workflow_dispatch:
    inputs:
      cn:
        description: 'Include Chinese version'
        required: false
        default: false
        type: boolean
      normal:
        description: 'Remove opinionated features'
        required: false
        default: false
        type: boolean
      no_liga:
        description: 'Remove ligatures'
        required: false
        default: false
        type: boolean
      no_hinted:
        description: 'Build unhinted font'
        required: false
        default: false
        type: boolean
      width:
        description: 'Glyph width mode (default|narrow|slim)'
        required: false
        default: default
        type: choice
        options:
          - default
          - narrow
          - slim
      nerd_font:
        description: 'Nerd Font icon mode'
        required: false
        default: default
        type: choice
        options:
          - default
          - mono
          - proportional
      feat:
        description: 'Enable features (e.g. cv01,zero)'
        required: false
        default: 'cv01,zero'
        type: string
      build_args:
        description: 'Other args for build.py'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'config.json'

permissions:
  contents: write

jobs:
  custom-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 检查是否需要 fontforge 补丁环境
          if [[ "${{ github.event.inputs.build_args }}" == *"--font-patcher"* ]] || python build.py --dry | jq -e '.nerd_font.use_font_patcher == true' >/dev/null; then
            sudo apt update -y -q
            sudo apt install software-properties-common python3-fontforge fuse -y -q
            curl -L "https://github.com/fontforge/fontforge/releases/download/20230101/FontForge-2023-01-01-a1dad3e-x86_64.AppImage" --output fontforge
            chmod u+x fontforge
            export PATH=`pwd`:$PATH
            echo "PATH=$PATH" >> $GITHUB_ENV
          fi

      - name: Run build script
        run: |
          # 关键优化：使用本地变量并设置默认值，防止 push 触发时参数为空
          VAL_CN="${{ github.event.inputs.cn || 'false' }}"
          VAL_NORMAL="${{ github.event.inputs.normal || 'false' }}"
          VAL_NO_LIGA="${{ github.event.inputs.no_liga || 'false' }}"
          VAL_NO_HINTED="${{ github.event.inputs.no_hinted || 'false' }}"
          VAL_WIDTH="${{ github.event.inputs.width || 'default' }}"
          VAL_NF="${{ github.event.inputs.nerd_font || 'default' }}"
          VAL_FEAT="${{ github.event.inputs.feat || 'cv01,zero' }}"
          VAL_EXTRA="${{ github.event.inputs.build_args || '' }}"

          build_args="--archive"
          [ "$VAL_CN" == "true" ] && build_args="$build_args --cn"
          [ "$VAL_NORMAL" == "true" ] && build_args="$build_args --normal"
          [ "$VAL_NO_LIGA" == "true" ] && build_args="$build_args --no-liga"
          [ "$VAL_NO_HINTED" == "true" ] && build_args="$build_args --no-hinted"
          
          # 修复 width 逻辑：只有非默认且非空时才添加参数
          if [ "$VAL_WIDTH" != "default" ] && [ -n "$VAL_WIDTH" ]; then
            build_args="$build_args --width $VAL_WIDTH"
          fi

          case "$VAL_NF" in
            default)      build_args="$build_args --nf" ;;
            mono)         build_args="$build_args --nf-mono" ;;
            proportional) build_args="$build_args --nf-propo" ;;
          esac

          [ -n "$VAL_FEAT" ] && build_args="$build_args --feat $VAL_FEAT"
          [ -n "$VAL_EXTRA" ] && build_args="$build_args $VAL_EXTRA"

          echo "BUILD_ARGS=$build_args" >> $GITHUB_ENV
          python build.py $build_args
        continue-on-error: false

      - name: Generate Checksums
        run: |
          echo "### SHA256 Checksums" >> NOTES
          echo "\`\`\`" >> NOTES
          if [ -d "fonts/archive" ]; then
            cd fonts/archive
            for f in *.*; do
              sha256sum "$f" >> ../../NOTES
            done
            cd ../..
          fi
          echo "\`\`\`" >> NOTES

      - name: Create release
        run: |
          if [ ! -d "fonts/archive" ]; then
            echo "Error: Build output directory not found."
            exit 1
          fi
          echo "### Build details" >> NOTES
          echo "- Command: \`python build.py $BUILD_ARGS\`" >> NOTES
          echo "- Date: $(date '+%Y-%m-%d %H:%M:%S')" >> NOTES
          
          # 使用当前的秒级时间戳作为 Tag，确保唯一
          gh release create "v$(date +%s)" fonts/archive/*.* --notes-file NOTES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}