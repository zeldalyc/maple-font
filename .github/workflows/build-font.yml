name: Custom Build with SHA256

on:
  workflow_dispatch:
    inputs:
      # ... (保持原有的 inputs 不变)
      feat:
        description: 'Enable features, e.g. "cv01,ss02,zero"'
        required: false
        default: 'cv01,zero' # 默认帮你开启完整的 @ 和带点的 0
        type: string
      # ... (其他 inputs 保持不变)

permissions:
  contents: write

jobs:
  custom-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 处理 Nerd Font 补丁工具依赖
          if [[ "${{ github.event.inputs.build_args }}" == *"--font-patcher"* ]] || python build.py --dry | jq -e '.nerd_font.use_font_patcher == true' >/dev/null; then
            sudo apt update -y -q
            sudo apt install software-properties-common python3-fontforge fuse -y -q
            curl -L "https://github.com/fontforge/fontforge/releases/download/20230101/FontForge-2023-01-01-a1dad3e-x86_64.AppImage" --output fontforge
            chmod u+x fontforge
            export PATH=`pwd`:$PATH
            echo "PATH=$PATH" >> $GITHUB_ENV
          fi

      - name: Run build script
        run: |
          # 组装复杂的编译参数
          build_args="--archive"
          [ "${{ github.event.inputs.cn }}" == "true" ] && build_args="$build_args --cn"
          [ "${{ github.event.inputs.normal }}" == "true" ] && build_args="$build_args --normal"
          [ "${{ github.event.inputs.no_liga }}" == "true" ] && build_args="$build_args --no-liga"
          [ "${{ github.event.inputs.no_hinted }}" == "true" ] && build_args="$build_args --no-hinted"
          [ "${{ github.event.inputs.width }}" != "default" ] && build_args="$build_args --width ${{ github.event.inputs.width }}"
          
          case "${{ github.event.inputs.nerd_font }}" in
            default) build_args="$build_args --nf" ;;
            mono) build_args="$build_args --nf-mono" ;;
            proportional) build_args="$build_args --nf-propo" ;;
          esac
          
          if [ -n "${{ github.event.inputs.feat }}" ]; then
            build_args="$build_args --feat ${{ github.event.inputs.feat }}"
          fi
          if [ -n "${{ github.event.inputs.build_args }}" ]; then
            build_args="$build_args ${{ github.event.inputs.build_args }}"
          fi

          echo "BUILD_ARGS=$build_args" >> $GITHUB_ENV
          python build.py $build_args
        continue-on-error: false # 建议改为 false，编译失败就别继续了

      - name: Generate SHA256 Checksums
        run: |
          echo "### SHA256 Checksums" >> NOTES
          echo "\`\`\`" >> NOTES
          # 进入产物目录计算所有压缩包的哈希
          if [ -d "fonts/archive" ]; then
            cd fonts/archive
            for f in *.*; do
              sha256sum "$f" >> ../../NOTES
            done
            cd ../..
          fi
          echo "\`\`\`" >> NOTES

      - name: Create release
        run: |
          if [ ! -d "fonts/archive" ]; then
            echo "Error: Build output directory not found."
            exit 1
          fi
          # 添加构建参数到备注
          echo "### Build details" >> NOTES
          echo "- Command: \`python build.py $BUILD_ARGS\`" >> NOTES
          echo "- Timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> NOTES
          
          # 使用 gh 命令行工具发布
          gh release create "v$(date +%Y%m%d-%H%M%S)" fonts/archive/*.* --notes-file NOTES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}