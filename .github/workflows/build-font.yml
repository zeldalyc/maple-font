name: Custom Font Build & Release

on:
  workflow_dispatch: 
  push:
    paths:
      - 'config.json'

# 核心修复：显式声明权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 如果项目有子模块，必须开启

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 开启缓存加速

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip ttfautohint # 安装一些常用的字体处理工具

      - name: Install Python Dependencies
        run: |
          # 优先安装项目自带的依赖列表
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 补全 Maple-font 编译必须的库
          pip install fonttools font-v brotli zopfli cu2qu

      - name: Build Font
        run: |
          # 运行编译，并捕获详细日志
          python build.py 
          
      - name: Check Output
        run: |
          # 检查编译产物在哪里，Maple-font 默认可能在 out 或 dist
          ls -R

      - name: Package Font
        run: |
          mkdir -p release_dist
          # 这里的路径需要根据上一步 ls -R 的结果调整，通常是 out/ 或 dist/
          if [ -d "out" ]; then zip -j release_dist/MapleMono-Custom.zip out/*.ttf out/*.otf; fi
          if [ -d "dist" ]; then zip -j release_dist/MapleMono-Custom.zip dist/*.ttf dist/*.otf; fi

      - name: Calculate Hash
        id: calc_hash
        run: |
          HASH=$(sha256sum release_dist/MapleMono-Custom.zip | awk '{print $1}')
          echo "SHA256=$HASH" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Custom Build v1.0.${{ github.run_number }}
          body: |
            SHA256: `${{ steps.calc_hash.outputs.SHA256 }}`
          files: release_dist/MapleMono-Custom.zip
